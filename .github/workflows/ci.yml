# Build, tests and packages on every push and pull request (docs/release.md).
# The same script builds the release packages locally: tools/package/build-in-container.sh.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # fedora:44: the main platform, .rpm and .tar.gz; ubuntu:24.04: .deb with Qt 6.4,
        # which also checks that no newer Qt API is used; one .deb per release (they do not
        # install across releases); windows: the MinGW cross-build
        target: ['fedora:44', 'ubuntu:24.04', 'ubuntu:26.04', 'debian:13', 'windows']
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and package in a container
        env:
          CONTAINER_ENGINE: docker   # rootful: the packages come out owned by the runner user
        run: tools/package/build-in-container.sh '${{ matrix.target }}'
      - name: Artifact name
        id: name
        run: echo "value=packages-$(echo '${{ matrix.target }}' | tr ':.' '--')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.value }}
          path: dist/
          if-no-files-found: error
