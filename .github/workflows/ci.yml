# Build, tests and packages on every push and pull request; on a vX.Y.Z tag also a draft
# GitHub release with all packages (docs/release.md, ADR 0025).
# The same script builds the packages locally: tools/package/build-in-container.sh.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # static: the release Linux packages, one .deb, one .rpm and the .tar.gz for all
        # distributions, with a static Qt (ADR 0028; the Qt image comes from the Actions cache,
        # ~30 min only when tools/static changes); windows: the MinGW cross-build. The distribution targets build against the system Qt as a check
        # (ubuntu:24.04 has Qt 6.4, the API minimum); their packages are not released.
        target: ['static', 'windows', 'fedora:44', 'ubuntu:24.04', 'ubuntu:26.04', 'debian:13']
    steps:
      - uses: actions/checkout@v4
      # The static Qt image: named by the hash of tools/static (build.sh --image-name), its layers
      # kept in the Actions cache, so Qt is compiled again only when those files change
      - name: Static Qt image name
        if: matrix.target == 'static'
        id: image
        run: echo "name=$(tools/static/build.sh --image-name)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: matrix.target == 'static'
      - name: Static Qt image
        if: matrix.target == 'static'
        uses: docker/build-push-action@v6
        with:
          context: tools/static
          tags: ${{ steps.image.outputs.name }}
          load: true
          cache-from: type=gha,scope=static-qt
          cache-to: type=gha,scope=static-qt,mode=max
      - name: Build, test and package in a container
        env:
          CONTAINER_ENGINE: docker   # rootful: the packages come out owned by the runner user
        run: tools/package/build-in-container.sh '${{ matrix.target }}'
      - name: Artifact name
        id: name
        run: |
          case '${{ matrix.target }}' in static|windows) kind=packages ;; *) kind=distro ;; esac
          echo "value=$kind-$(echo '${{ matrix.target }}' | tr ':.' '--')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.value }}
          path: dist/
          if-no-files-found: error

  release:
    # A tag vX.Y.Z: the packages of all targets go into a draft release, published by hand
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version in CMakeLists.txt and CHANGELOG.md
        run: |
          version=$(sed -n 's/^project(Markpaste VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [ "v$version" = "$TAG" ] || { echo "tag $TAG, but CMakeLists.txt has $version" >&2; exit 1; }
          tools/package/release-notes.sh "$version" > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Draft release
        run: |
          if draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            # Never replace the files of a published release: their checksums are already out
            [ "$draft" = true ] || { echo "$TAG is already published" >&2; exit 1; }
            # A draft (e.g. after moving the tag): replace the files, keep its text
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag \
              --title "Markpaste ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
